name: HTTP build and adapter contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: dotnet build src/KoikatuMCP.csproj -c Release
      - run: python -m unittest discover -s extensions/KKStudioSocket/tests -v
      - run: python -m unittest discover -s tests -v
      # The paired game DLL is built against a user's installed game, not redistributed on CI.
